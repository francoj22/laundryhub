AWSTemplateFormatVersion: '2010-09-09'
Description: Laundry microservices DynamoDB stack

Parameters:
  SubmissionsTableName:
    Type: String
    Default: submissions
    Description: DynamoDB table name used by submissions-service
  PaymentsTableName:
    Type: String
    Default: payments
    Description: DynamoDB table name used by payments-service

Resources:
  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref SubmissionsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PaymentsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  LaundryDynamoDbPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub laundry-dynamodb-${AWS::StackName}
      Description: Least-privilege policy for laundry microservices DynamoDB access
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DynamoDbCrud
            Effect: Allow
            Action:
              - dynamodb:DescribeTable
              - dynamodb:PutItem
              - dynamodb:Scan
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt SubmissionsTable.Arn
              - !GetAtt PaymentsTable.Arn

Outputs:
  SubmissionsTableNameOutput:
    Description: Name of submissions table
    Value: !Ref SubmissionsTable
  PaymentsTableNameOutput:
    Description: Name of payments table
    Value: !Ref PaymentsTable
  LaundryDynamoDbPolicyArn:
    Description: Managed policy ARN for EC2 role attachment
    Value: !Ref LaundryDynamoDbPolicy
