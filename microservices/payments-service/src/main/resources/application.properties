spring.application.name=payments-service
server.port=8083

spring.datasource.url=${PAYMENTS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${PAYMENTS_DATASOURCE_USERNAME:payments}
spring.datasource.password=${PAYMENTS_DATASOURCE_PASSWORD:payments}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

payments.security.webhook-secret=${PAYMENTS_WEBHOOK_SECRET:change-me-webhook-secret}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
