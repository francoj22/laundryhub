<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Laundry Microservices Architecture</title>
  <desc id="desc">Architecture diagram showing browser, WAF, ALB, API gateway, submissions service, payments service, DynamoDB, PostgreSQL, and monitoring components.</desc>

  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 12px Arial, sans-serif; fill: #374151; }
      .box { fill: #eef6ff; stroke: #3b82f6; stroke-width: 2; rx: 16; }
      .gateway { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 16; }
      .db { fill: #eefdf5; stroke: #10b981; stroke-width: 2; rx: 16; }
      .obs { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; rx: 16; }
      .client { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; rx: 16; }
      .text { font: 600 18px Arial, sans-serif; fill: #111827; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowGreen { stroke: #10b981; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrowOrange { stroke: #f59e0b; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
    </style>

    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="600" y="50" text-anchor="middle" class="title">Laundry Microservices Architecture</text>

  <rect x="60" y="110" width="150" height="90" class="client"/>
  <text x="135" y="150" text-anchor="middle" class="text">Browser</text>
  <text x="135" y="172" text-anchor="middle" class="small">/ Mobile App</text>

  <rect x="250" y="110" width="170" height="90" class="box"/>
  <text x="335" y="150" text-anchor="middle" class="text">CloudFront</text>
  <text x="335" y="172" text-anchor="middle" class="small">WAF / Edge</text>

  <rect x="460" y="110" width="170" height="90" class="box"/>
  <text x="545" y="150" text-anchor="middle" class="text">ALB</text>
  <text x="545" y="172" text-anchor="middle" class="small">TLS / Routing</text>

  <rect x="690" y="110" width="210" height="110" class="gateway"/>
  <text x="795" y="150" text-anchor="middle" class="text">API Gateway</text>
  <text x="795" y="173" text-anchor="middle" class="small">JWT auth</text>
  <text x="795" y="194" text-anchor="middle" class="small">bg / rate limit</text>

  <rect x="640" y="310" width="220" height="100" class="box"/>
  <text x="750" y="350" text-anchor="middle" class="text">Submissions</text>
  <text x="750" y="372" text-anchor="middle" class="small">Service</text>

  <rect x="900" y="310" width="220" height="100" class="box"/>
  <text x="1010" y="350" text-anchor="middle" class="text">Payments</text>
  <text x="1010" y="372" text-anchor="middle" class="small">Service</text>

  <rect x="640" y="470" width="220" height="90" class="db"/>
  <text x="750" y="510" text-anchor="middle" class="text">DynamoDB</text>
  <text x="750" y="532" text-anchor="middle" class="small">Submissions data</text>

  <rect x="900" y="470" width="220" height="90" class="db"/>
  <text x="1010" y="510" text-anchor="middle" class="text">PostgreSQL</text>
  <text x="1010" y="532" text-anchor="middle" class="small">Payments data</text>

  <rect x="380" y="470" width="200" height="90" class="obs"/>
  <text x="480" y="510" text-anchor="middle" class="text">Monitoring</text>
  <text x="480" y="532" text-anchor="middle" class="small">Logs / Metrics / Traces</text>

  <path d="M210 155 H250" class="arrow"/>
  <path d="M420 155 H460" class="arrow"/>
  <path d="M630 155 H690" class="arrow"/>

  <path d="M795 220 V310" class="arrow"/>
  <path d="M795 220 L750 310" class="arrow"/>
  <path d="M795 220 L1010 310" class="arrow"/>

  <path d="M750 410 V470" class="arrowGreen"/>
  <path d="M1010 410 V470" class="arrowGreen"/>

  <path d="M750 360 H660" class="arrowOrange"/>
  <path d="M1010 360 H1080" class="arrowOrange"/>

  <path d="M580 515 H640" class="arrowOrange"/>
  <path d="M900 515 H860" class="arrowOrange"/>

  <text x="309" y="95" text-anchor="middle" class="small">public traffic</text>
  <text x="794" y="288" text-anchor="middle" class="small">request routing</text>
  <text x="745" y="450" text-anchor="middle" class="small">reads/writes</text>
  <text x="1010" y="450" text-anchor="middle" class="small">reads/writes</text>
</svg>
