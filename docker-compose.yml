services:
  payments-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data

  submissions-service:
    build:
      context: ./microservices/submissions-service
    ports:
      - "8082:8082"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DYNAMODB_SUBMISSIONS_TABLE: ${DYNAMODB_SUBMISSIONS_TABLE:-submissions}
      DYNAMODB_AUTO_CREATE_TABLE: ${DYNAMODB_AUTO_CREATE_TABLE:-true}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}

  payments-service:
    build:
      context: ./microservices/payments-service
    ports:
      - "8083:8083"
    environment:
      PAYMENTS_DATASOURCE_URL: ${PAYMENTS_DATASOURCE_URL:-jdbc:postgresql://payments-db:5432/payments}
      PAYMENTS_DATASOURCE_USERNAME: ${PAYMENTS_DATASOURCE_USERNAME:-payments}
      PAYMENTS_DATASOURCE_PASSWORD: ${PAYMENTS_DATASOURCE_PASSWORD:-payments}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-change-me-webhook-secret}
    depends_on:
      - payments-db

  gateway:
    build:
      context: ./microservices/gateway
    ports:
      - "8080:8080"
    environment:
      SERVICES_SUBMISSIONS_URL: ${SERVICES_SUBMISSIONS_URL:-http://submissions-service:8082}
      SERVICES_PAYMENTS_URL: ${SERVICES_PAYMENTS_URL:-http://payments-service:8083}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-change-this-to-a-long-random-256-bit-secret-key}
    depends_on:
      - submissions-service
      - payments-service

volumes:
  payments-db-data:
